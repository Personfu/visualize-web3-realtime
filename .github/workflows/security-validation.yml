name: Security and application validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      TURBO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.4
      - run: npm install --global npm@10.8.2
      - run: npm ci --ignore-scripts --strict-peer-deps --legacy-peer-deps=false
      - name: Preserve the complete audit and fail on critical or high findings
        run: npm audit --audit-level=high
      - run: npm run test:offline
      - run: npm run typecheck
      - run: npm run build
      - run: npm run build --workspace @web3viz/playground
      - name: Real lint across the source tree (existing debt remains blocking)
        run: npm run lint
